<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>S.M.O.G. Driving Simulator</title>

<style>

/* =========================================================
   BASIC SETUP
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #20242a;
    color: #ffffff;
}

body {
    display: flex;
    justify-content: center;
    padding: 10px;
}

.simulator {
    width: min(1100px, 100%);
}


/* =========================================================
   SIMULATION
========================================================= */

.simulation {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    min-height: 500px;
    overflow: hidden;
    border: 3px solid #11161b;
    border-radius: 12px;
    background: #78b8df;
}


/* =========================================================
   SKY
========================================================= */

.sky {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 38%;

    background: linear-gradient(
        to bottom,
        #65afe0 0%,
        #b6ddf1 100%
    );
}


/* =========================================================
   CLOUDS
========================================================= */

.cloud {
    position: absolute;
    width: 110px;
    height: 32px;
    background: rgba(255,255,255,.82);
    border-radius: 30px;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: inherit;
    border-radius: 50%;
}

.cloud::before {
    width: 48px;
    height: 48px;
    left: 18px;
    bottom: 8px;
}

.cloud::after {
    width: 60px;
    height: 60px;
    right: 15px;
    bottom: 4px;
}

.cloud1 {
    top: 10%;
    left: 8%;
}

.cloud2 {
    top: 15%;
    right: 12%;
    transform: scale(.75);
}


/* =========================================================
   GRASS
========================================================= */

.grass {
    position: absolute;
    top: 38%;
    bottom: 0;

    background: #568d47;
}

.grass.left {
    left: 0;
    width: 8%;
}

.grass.right {
    right: 0;
    width: 8%;
}


/* =========================================================
   ROADWAY
========================================================= */

/*
   RIGHT TO LEFT:

   GRASS
   LANE 1
   LANE 2
   CENTER TURN LANE
   LANE 4
   LANE 5
   GRASS
*/

.road {
    position: absolute;

    left: 8%;
    right: 8%;
    top: 38%;
    bottom: 0;

    display: grid;

    grid-template-columns:
        1fr
        1fr
        1fr
        1fr
        1fr;

    background: #4d5053;

    z-index: 5;
}


/* =========================================================
   LANES
========================================================= */

.lane {
    position: relative;

    height: 100%;

    border-right: 3px dashed rgba(255,255,255,.85);
}


/* Last lane */

.lane:last-child {
    border-right: none;
}


/* Center turn lane */

.turn-lane {
    background: #55585b;

    border-left: 4px solid #e5c84a;
    border-right: 4px solid #e5c84a;
}


/* Yellow center lane markings */

.turn-lane::before,
.turn-lane::after {

    content: "";

    position: absolute;

    left: 0;
    right: 0;

    height: 5px;

    background: #e5c84a;
}

.turn-lane::before {
    top: 0;
}

.turn-lane::after {
    bottom: 0;
}


/* =========================================================
   LANE LABELS
========================================================= */

.lane-label {

    position: absolute;

    top: 8%;

    left: 50%;

    transform:
        translateX(-50%);

    font-size: 11px;

    font-weight: bold;

    color: rgba(255,255,255,.45);

    white-space: nowrap;
}


/* =========================================================
   ROAD ARROWS
========================================================= */

.direction-arrow {

    position: absolute;

    left: 50%;

    top: 25%;

    transform:
        translateX(-50%);

    font-size: 34px;

    color: rgba(255,255,255,.35);

    font-weight: bold;
}


/* =========================================================
   MIRRORS
========================================================= */

.mirror {

    position: absolute;

    top: 4%;

    width: 17%;
    height: 12%;

    background: #101418;

    border: 3px solid #343a40;

    border-radius: 12px;

    box-shadow:
        0 4px 12px rgba(0,0,0,.45);

    overflow: hidden;

    z-index: 30;

    transition:
        border-color .3s ease,
        box-shadow .3s ease,
        transform .3s ease;
}

.mirror.left {
    left: 2%;
}

.mirror.right {
    right: 2%;
}

.mirror.rear {

    left: 50%;

    transform:
        translateX(-50%);

    width: 23%;
}

.mirror-view {

    position: absolute;

    inset: 7px;

    border-radius: 7px;

    background:
        linear-gradient(
            to bottom,
            #78b9dc 0 40%,
            #669252 40% 65%,
            #55585b 65% 100%
        );
}

.mirror-label {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 3px;

    text-align: center;

    font-size: 10px;

    font-weight: bold;

    color: #ffffff;

    text-shadow:
        0 1px 2px #000;
}


/* Highlighted mirror */

.mirror.highlight {

    border-color: #ffd54a;

    box-shadow:
        0 0 0 4px rgba(255,213,74,.35),
        0 0 25px rgba(255,213,74,.9);

    transform:
        scale(1.06);
}

.mirror.rear.highlight {

    transform:
        translateX(-50%)
        scale(1.06);
}


/* =========================================================
   CAR
========================================================= */

.car {

    position: absolute;

    /*
       Initial position = Lane 2.

       The roadway contains five equal lanes.

       Lane centers from left to right:

       Lane 5 = 10%
       Lane 4 = 30%
       Turn   = 50%
       Lane 2 = 70%
       Lane 1 = 90%

       Therefore the car begins at 70%.
    */

    left: 70%;

    top: 59%;

    width: 11%;
    height: 28%;

    transform:
        translateX(-50%);

    z-index: 20;

    transition:
        left 1.5s ease,
        transform .8s ease;
}


/* Car body */

.car-body {

    position: absolute;

    left: 10%;
    right: 10%;

    top: 15%;
    bottom: 0;

    background: #c62828;

    border: 4px solid #7e1717;

    border-radius:
        28px
        28px
        14px
        14px;

    box-shadow:
        0 8px 14px rgba(0,0,0,.45);
}


/* Windows */

.car-window {

    position: absolute;

    left: 23%;
    right: 23%;

    top: 7%;

    height: 31%;

    background: #253b4b;

    border: 3px solid #111a20;

    border-radius:
        15px
        15px
        5px
        5px;
}


/* Hood */

.hood {

    position: absolute;

    left: 17%;
    right: 17%;

    top: 43%;

    height: 26%;

    background: #d73535;

    border-radius: 10px;

    border-top:
        2px solid #ef6969;
}


/* Headlights */

.headlight {

    position: absolute;

    width: 18%;
    height: 10%;

    top: 67%;

    background: #f5f0c8;

    border-radius: 5px;
}

.headlight.left {
    left: 16%;
}

.headlight.right {
    right: 16%;
}


/* Turn signals */

.turn-signal {

    position: absolute;

    width: 11%;
    height: 7%;

    top: 70%;

    border-radius: 50%;

    background: #555;

    transition:
        background .2s ease,
        box-shadow .2s ease;
}

.turn-signal.left {
    left: 8%;
}

.turn-signal.right {
    right: 8%;
}

.turn-signal.active {

    background: #ffb300;

    box-shadow:
        0 0 15px #ffb300;
}


/* =========================================================
   BLIND SPOT
========================================================= */

/*
   The blind spot is deliberately positioned behind
   and to the selected side of the vehicle.
*/

.blindspot {
    position: absolute;

    width: 10%;
    height: 13%;

    top: 76%;

    background: rgba(255,193,7,0);

    border:
        3px solid transparent;

    border-radius: 50%;

    z-index: 12;

    pointer-events: none;

    transition:
        background .35s ease,
        border-color .35s ease,
        box-shadow .35s ease,
        opacity .35s ease;
}


.blindspot.left,
.blindspot.right {

    /*
       JavaScript will position the marker
       dynamically based on the car's
       current lane.
    */

    left: 0;

}


/* Highlight */

.blindspot.highlight {

    background:
        rgba(255,193,7,.32);

    border-color:
        #ffd54a;

    box-shadow:
        0 0 25px rgba(255,213,74,.9);
}


.blindspot-label {

    position: absolute;

    left: 0;
    right: 0;

    top: 50%;

    transform:
        translateY(-50%);

    text-align: center;

    font-size: 11px;

    font-weight: bold;

    color: #ffffff;

    text-shadow:
        0 2px 3px #000;

    opacity: 0;
}

.blindspot.highlight
.blindspot-label {

    opacity: 1;
}


/* =========================================================
   SHOULDER CHECK
========================================================= */

.car.shoulder-left {

    transform:
        translateX(-50%)
        rotate(-8deg);
}

.car.shoulder-right {

    transform:
        translateX(-50%)
        rotate(8deg);
}


/* =========================================================
   INSTRUCTION
========================================================= */

.instruction {

    position: absolute;

    left: 50%;

    top: 19%;

    transform:
        translateX(-50%);

    width: min(500px, 80%);

    padding:
        12px 18px;

    background:
        rgba(0,0,0,.72);

    border-radius: 8px;

    text-align: center;

    font-size: 17px;

    font-weight: bold;

    z-index: 50;
}


/* =========================================================
   DIRECTION BUTTONS
========================================================= */

.direction-controls {

    position: absolute;

    left: 50%;

    top: 36%;

    transform:
        translateX(-50%);

    display: flex;

    gap: 18px;

    z-index: 60;

    transition:
        opacity .3s ease;
}


.direction-button {

    min-width: 190px;

    padding:
        14px 20px;

    border:
        3px solid #20252a;

    border-radius: 9px;

    background: #ffffff;

    color: #111111;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 5px 12px rgba(0,0,0,.4);
}


.direction-button:hover:not(:disabled) {

    background: #f2f2f2;

    transform:
        translateY(-2px);
}


.direction-button:disabled {

    opacity: .35;

    cursor: not-allowed;
}


.direction-controls.hidden {

    opacity: 0;

    pointer-events: none;
}


/* =========================================================
   S.M.O.G. PANEL
========================================================= */

.smog-panel {

    position: absolute;

    left: 50%;

    bottom: 2%;

    transform:
        translateX(-50%);

    width: min(700px, 92%);

    padding:
        10px 14px;

    background:
        rgba(17,22,27,.94);

    border:
        2px solid #343a40;

    border-radius: 10px;

    z-index: 40;
}


.smog-title {

    text-align: center;

    font-size: 13px;

    font-weight: bold;

    letter-spacing: 3px;

    margin-bottom: 8px;
}


.smog-steps {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 7px;
}


.smog-step {

    padding:
        7px 5px;

    text-align: center;

    background:
        #252b31;

    border:
        2px solid #3a424a;

    border-radius: 7px;

    transition:
        background .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
}


.step-letter {

    display: inline-block;

    font-size: 18px;

    font-weight: bold;

    margin-right: 3px;
}


.step-name {

    font-size: 10px;

    color: #cbd1d6;
}


.step-status {

    display: block;

    margin-top: 3px;

    font-size: 10px;

    font-weight: bold;

    color: #aeb6c0;
}


/* Current */

.smog-step.current {

    border-color:
        #ffd54a;

    background:
        #443b18;

    box-shadow:
        0 0 15px rgba(255,213,74,.45);
}


/* Complete */

.smog-step.complete {

    border-color:
        #35c759;

    background:
        #193521;
}


.smog-step.complete
.step-status {

    color:
        #57e879;
}


/* =========================================================
   SUCCESS
========================================================= */

.success-message {

    position: absolute;

    left: 50%;

    top: 28%;

    transform:
        translateX(-50%)
        scale(.8);

    padding:
        14px 25px;

    background:
        rgba(22,105,48,.94);

    border:
        2px solid #65e58a;

    border-radius: 10px;

    font-size: 18px;

    font-weight: bold;

    opacity: 0;

    pointer-events: none;

    z-index: 70;

    transition:
        opacity .3s ease,
        transform .3s ease;
}


.success-message.show {

    opacity: 1;

    transform:
        translateX(-50%)
        scale(1);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 700px) {

    body {
        padding: 5px;
    }

    .simulation {
        min-height: 400px;
    }

    .direction-controls {

        width: 90%;

        gap: 8px;
    }

    .direction-button {

        min-width: 0;

        width: 50%;

        padding:
            10px 5px;

        font-size: 11px;
    }

    .instruction {

        font-size: 13px;

        top: 20%;

        width: 88%;
    }

    .smog-panel {

        width: 94%;

        padding: 7px;
    }

    .step-letter {

        font-size: 15px;
    }

    .step-name,
    .step-status {

        font-size: 8px;
    }

    .mirror-label {

        font-size: 7px;
    }

    .lane-label {

        font-size: 8px;
    }

}

</style>
</head>


<body>


<div class="simulator">

<div class="simulation">


<!-- =====================================================
     SKY
====================================================== -->

<div class="sky"></div>

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>


<!-- =====================================================
     GRASS
====================================================== -->

<div class="grass left"></div>
<div class="grass right"></div>


<!-- =====================================================
     ROAD
====================================================== -->

<div class="road">

    <!-- Lane 5 — opposing traffic -->

    <div class="lane">

        <div class="lane-label">
            LANE 5
        </div>

        <div class="direction-arrow">
            ↓
        </div>

    </div>


    <!-- Lane 4 — opposing traffic -->

    <div class="lane">

        <div class="lane-label">
            LANE 4
        </div>

        <div class="direction-arrow">
            ↓
        </div>

    </div>


    <!-- Center turn lane -->

    <div class="lane turn-lane">

        <div class="lane-label">
            CENTER TURN
        </div>

    </div>


    <!-- Lane 2 — student's direction -->

    <div class="lane">

        <div class="lane-label">
            LANE 2
        </div>

        <div class="direction-arrow">
            ↑
        </div>

    </div>


    <!-- Lane 1 — student's direction -->

    <div class="lane">

        <div class="lane-label">
            LANE 1
        </div>

        <div class="direction-arrow">
            ↑
        </div>

    </div>

</div>


<!-- =====================================================
     MIRRORS
====================================================== -->

<div
    class="mirror left"
    id="leftMirror">

    <div class="mirror-view"></div>

    <div class="mirror-label">
        LEFT MIRROR
    </div>

</div>


<div
    class="mirror rear"
    id="rearMirror">

    <div class="mirror-view"></div>

    <div class="mirror-label">
        REAR VIEW
    </div>

</div>


<div
    class="mirror right"
    id="rightMirror">

    <div class="mirror-view"></div>

    <div class="mirror-label">
        RIGHT MIRROR
    </div>

</div>


<!-- =====================================================
     BLIND SPOTS
====================================================== -->

<div
    class="blindspot left"
    id="leftBlindspot">

    <div class="blindspot-label">
        BLIND SPOT
    </div>

</div>


<div
    class="blindspot right"
    id="rightBlindspot">

    <div class="blindspot-label">
        BLIND SPOT
    </div>

</div>


<!-- =====================================================
     CAR
====================================================== -->

<div
    class="car"
    id="car">

    <div class="car-body"></div>

    <div class="car-window"></div>

    <div class="hood"></div>

    <div class="headlight left"></div>

    <div class="headlight right"></div>

    <div
        class="turn-signal left"
        id="leftSignalLight">
    </div>

    <div
        class="turn-signal right"
        id="rightSignalLight">
    </div>

</div>


<!-- =====================================================
     INSTRUCTION
====================================================== -->

<div
    class="instruction"
    id="instruction">

    Choose whether you want to
    move/turn left or right.

</div>


<!-- =====================================================
     DIRECTION BUTTONS
====================================================== -->

<div
    class="direction-controls"
    id="directionControls">

    <button
        class="direction-button"
        id="leftButton">

        MOVE / TURN LEFT

    </button>


    <button
        class="direction-button"
        id="rightButton">

        MOVE / TURN RIGHT

    </button>

</div>


<!-- =====================================================
     S.M.O.G.
====================================================== -->

<div class="smog-panel">

    <div class="smog-title">
        S.M.O.G.
    </div>


    <div class="smog-steps">


        <div
            class="smog-step"
            id="stepSignal">

            <span class="step-letter">
                S
            </span>

            <span class="step-name">
                SIGNAL
            </span>

            <span
                class="step-status"
                id="signalStatus">

                READY

            </span>

        </div>


        <div
            class="smog-step"
            id="stepMirrors">

            <span class="step-letter">
                M
            </span>

            <span class="step-name">
                MIRRORS
            </span>

            <span
                class="step-status"
                id="mirrorStatus">

                READY

            </span>

        </div>


        <div
            class="smog-step"
            id="stepShoulder">

            <span class="step-letter">
                O
            </span>

            <span class="step-name">
                OVER SHOULDER
            </span>

            <span
                class="step-status"
                id="shoulderStatus">

                READY

            </span>

        </div>


        <div
            class="smog-step"
            id="stepGo">

            <span class="step-letter">
                G
            </span>

            <span class="step-name">
                GO
            </span>

            <span
                class="step-status"
                id="goStatus">

                READY

            </span>

        </div>

    </div>

</div>


<!-- =====================================================
     SUCCESS
====================================================== -->

<div
    class="success-message"
    id="successMessage">

    S.M.O.G. COMPLETE

</div>


</div>

</div>


<script>

/* =========================================================
   BUILD 1.2
   S.M.O.G. DRIVING SIMULATOR
========================================================= */


/*
   ROAD POSITION

   0 = Lane 1
   1 = Lane 2
   2 = Center Turn Lane
   3 = Lane 4
   4 = Lane 5

   The vehicle starts in Lane 2.

   Therefore:

   currentLane = 1
*/

let currentLane = 1;

let selectedDirection = null;

let exerciseRunning = false;


/* =========================================================
   ELEMENTS
========================================================= */

const leftButton =
    document.getElementById(
        "leftButton"
    );

const rightButton =
    document.getElementById(
        "rightButton"
    );

const directionControls =
    document.getElementById(
        "directionControls"
    );

const instruction =
    document.getElementById(
        "instruction"
    );

const car =
    document.getElementById(
        "car"
    );

const leftSignalLight =
    document.getElementById(
        "leftSignalLight"
    );

const rightSignalLight =
    document.getElementById(
        "rightSignalLight"
    );

const leftMirror =
    document.getElementById(
        "leftMirror"
    );

const rightMirror =
    document.getElementById(
        "rightMirror"
    );

const rearMirror =
    document.getElementById(
        "rearMirror"
    );

const leftBlindspot =
    document.getElementById(
        "leftBlindspot"
    );

const rightBlindspot =
    document.getElementById(
        "rightBlindspot"
    );

const stepSignal =
    document.getElementById(
        "stepSignal"
    );

const stepMirrors =
    document.getElementById(
        "stepMirrors"
    );

const stepShoulder =
    document.getElementById(
        "stepShoulder"
    );

const stepGo =
    document.getElementById(
        "stepGo"
    );

const signalStatus =
    document.getElementById(
        "signalStatus"
    );

const mirrorStatus =
    document.getElementById(
        "mirrorStatus"
    );

const shoulderStatus =
    document.getElementById(
        "shoulderStatus"
    );

const goStatus =
    document.getElementById(
        "goStatus"
    );

const successMessage =
    document.getElementById(
        "successMessage"
    );


/* =========================================================
   LANE POSITION
=========================================================

   The five lanes are:

   Lane 5       10%
   Lane 4       30%
   Center       50%
   Lane 2       70%
   Lane 1       90%

   Remember that CSS "left" increases toward the right.
========================================================= */

const lanePositions = {

    0: "90%",   // Lane 1

    1: "70%",   // Lane 2

    2: "50%",   // Center turn lane

    3: "30%",   // Lane 4

    4: "10%"    // Lane 5

};


/* =========================================================
   INITIALIZE
========================================================= */

setCarToLane();

updateDirectionButtons();


/* =========================================================
   BUTTON EVENTS
========================================================= */

leftButton.addEventListener(
    "click",
    function () {

        if (exerciseRunning) {
            return;
        }

        if (!canMoveLeft()) {
            return;
        }

        startExercise("left");

    }
);


rightButton.addEventListener(
    "click",
    function () {

        if (exerciseRunning) {
            return;
        }

        if (!canMoveRight()) {
            return;
        }

        startExercise("right");

    }
);


/* =========================================================
   MOVEMENT RULES
========================================================= */

function canMoveLeft() {

    /*
       Lane positions:

       0 = Lane 1
       1 = Lane 2
       2 = Center Turn Lane

       From Lane 1:
           LEFT → Lane 2

       From Lane 2:
           LEFT → Center Turn Lane

       From Center Turn Lane:
           LEFT = NOT ALLOWED
           (would enter opposing traffic)
    */

    return currentLane < 2;

}


function canMoveRight() {

    /*
       From Lane 1:
           RIGHT = NOT ALLOWED
           (would leave roadway)

       From Lane 2:
           RIGHT → Lane 1

       From Center Turn Lane:
           RIGHT → Lane 2
    */

    return currentLane > 0 && currentLane <= 2;

}


/* =========================================================
   BUTTON AVAILABILITY
========================================================= */

function updateDirectionButtons() {

    leftButton.disabled =
        !canMoveLeft();

    rightButton.disabled =
        !canMoveRight();

}


/* =========================================================
   START EXERCISE
========================================================= */

function startExercise(direction) {

    exerciseRunning = true;

    selectedDirection =
        direction;

    resetVisualState();

    directionControls.classList.add(
        "hidden"
    );


    instruction.textContent =
        direction === "left"
            ? "Prepare to move left."
            : "Prepare to move right.";


    setTimeout(
        runSignalStep,
        700
    );

}

/* =========================================================
   FLASH TURN SIGNAL
========================================================= */

function startTurnSignal() {

    const signal =
        selectedDirection === "left"
            ? leftSignalLight
            : rightSignalLight;


    let flashCount = 0;

    const maxFlashes = 6;


    const flashTimer = setInterval(
        function () {

            signal.classList.toggle(
                "active"
            );

            flashCount++;


            if (flashCount >= maxFlashes) {

                clearInterval(
                    flashTimer
                );

                /*
                   Make sure the signal is
                   off before moving to mirrors.
                */

                signal.classList.remove(
                    "active"
                );

            }

        },
        220
    );

}
   
/* =========================================================
   STEP 1 — SIGNAL
========================================================= */

function runSignalStep() {

    setCurrentStep(
        stepSignal
    );


    instruction.textContent =
        selectedDirection === "left"
            ? "SIGNAL — Left signal activated."
            : "SIGNAL — Right signal activated.";


startTurnSignal();


    signalStatus.textContent =
        "✓ COMPLETE";

    stepSignal.classList.add(
        "complete"
    );


    setTimeout(
        runMirrorStep,
        1400
    );

}


/* =========================================================
   STEP 2 — MIRRORS
========================================================= */

function runMirrorStep() {

    setCurrentStep(
        stepMirrors
    );


    instruction.textContent =
        selectedDirection === "left"
            ? "CHECK REARVIEW AND LEFT MIRROR."
            : "CHECK REARVIEW AND RIGHT MIRROR.";


    /*
       Rearview mirror always highlights.
    */

    rearMirror.classList.add(
        "highlight"
    );


    /*
       Highlight selected side mirror.
    */

    if (selectedDirection === "left") {

        leftMirror.classList.add(
            "highlight"
        );

    }
    else {

        rightMirror.classList.add(
            "highlight"
        );

    }


    mirrorStatus.textContent =
        "✓ COMPLETE";

    stepMirrors.classList.add(
        "complete"
    );


    setTimeout(
        runShoulderStep,
        1800
    );

}


/* =========================================================
   STEP 3 — OVER SHOULDER
========================================================= */

function runShoulderStep() {

    setCurrentStep(
        stepShoulder
    );


    /*
       Remove mirror highlights.
    */

    rearMirror.classList.remove(
        "highlight"
    );

    leftMirror.classList.remove(
        "highlight"
    );

    rightMirror.classList.remove(
        "highlight"
    );


    /*
       Show blind spot behind the vehicle
       on the selected side.
    */

    if (selectedDirection === "left") {

    leftBlindspot.classList.add(
        "highlight"
    );

    car.classList.add(
        "shoulder-left"
    );

    instruction.textContent =
        "LOOK OVER YOUR LEFT SHOULDER.";

}
else {

    rightBlindspot.classList.add(
        "highlight"
    );

    car.classList.add(
        "shoulder-right"
    );

    instruction.textContent =
        "LOOK OVER YOUR RIGHT SHOULDER.";

}


    shoulderStatus.textContent =
        "✓ COMPLETE";

    stepShoulder.classList.add(
        "complete"
    );


    setTimeout(
        runGoStep,
        1800
    );

}


/* =========================================================
   STEP 4 — GO
========================================================= */

function runGoStep() {

    setCurrentStep(
        stepGo
    );


    /*
       Remove blind spot.
    */

    leftBlindspot.classList.remove(
        "highlight"
    );

    rightBlindspot.classList.remove(
        "highlight"
    );


    car.classList.remove(
        "shoulder-left"
    );

    car.classList.remove(
        "shoulder-right"
    );


    instruction.textContent =
        "GO — Moving into the selected lane.";


    goStatus.textContent =
        "✓ COMPLETE";

    stepGo.classList.add(
        "complete"
    );


    moveVehicle();


    setTimeout(
        finishExercise,
        1800
    );

}


/* =========================================================
   MOVE VEHICLE
========================================================= */

function moveVehicle() {

    /*
       LEFT:

       Lane 2 → Center Turn Lane

       RIGHT:

       Lane 2 → Lane 1

       The car moves completely to the
       destination lane.
    */

    if (selectedDirection === "left") {

        currentLane =
            currentLane + 1;

    }


    if (selectedDirection === "right") {

        currentLane =
            currentLane - 1;

    }


    setCarToLane();

}


/* =========================================================
   POSITION CAR
========================================================= */

function setCarToLane() {

    car.style.left =
        lanePositions[currentLane];

}

/* =========================================================
   POSITION BLIND SPOT
========================================================= */

function positionBlindSpots() {

    /*
       Convert the car's CSS left position
       into a numerical percentage.
    */

    const carPosition =
        parseFloat(
            lanePositions[currentLane]
        );


    /*
       The blind spot should sit beside
       and slightly behind the car.

       Because the car itself is approximately
       11% wide, we offset the marker toward
       the selected side.
    */

    const leftPosition =
        carPosition - 8;

    const rightPosition =
        carPosition + 8;


    /*
       Position the markers.
    */

    leftBlindspot.style.left =
        leftPosition + "%";

    rightBlindspot.style.left =
        rightPosition + "%";

}


/* =========================================================
   FINISH EXERCISE
========================================================= */

function finishExercise() {

    exerciseRunning = false;


    /*
       Turn signals off.
    */

    leftSignalLight.classList.remove(
        "active"
    );

    rightSignalLight.classList.remove(
        "active"
    );


    successMessage.classList.add(
        "show"
    );


    instruction.textContent =
        "S.M.O.G. complete. Lane change successful.";


    updateDirectionButtons();


    setTimeout(
        function () {

            successMessage.classList.remove(
                "show"
            );

            directionControls.classList.remove(
                "hidden"
            );

        },
        1800
    );

}


/* =========================================================
   CURRENT STEP
========================================================= */

function setCurrentStep(step) {

    stepSignal.classList.remove(
        "current"
    );

    stepMirrors.classList.remove(
        "current"
    );

    stepShoulder.classList.remove(
        "current"
    );

    stepGo.classList.remove(
        "current"
    );


    step.classList.add(
        "current"
    );

}


/* =========================================================
   RESET VISUAL STATE
========================================================= */

function resetVisualState() {

    /*
       S.M.O.G. steps
    */

    stepSignal.classList.remove(
        "complete",
        "current"
    );

    stepMirrors.classList.remove(
        "complete",
        "current"
    );

    stepShoulder.classList.remove(
        "complete",
        "current"
    );

    stepGo.classList.remove(
        "complete",
        "current"
    );


    /*
       Status
    */

    signalStatus.textContent =
        "READY";

    mirrorStatus.textContent =
        "READY";

    shoulderStatus.textContent =
        "READY";

    goStatus.textContent =
        "READY";


    /*
       Mirrors
    */

    leftMirror.classList.remove(
        "highlight"
    );

    rightMirror.classList.remove(
        "highlight"
    );

    rearMirror.classList.remove(
        "highlight"
    );


    /*
       Blind spots
    */

    leftBlindspot.classList.remove(
        "highlight"
    );

    rightBlindspot.classList.remove(
        "highlight"
    );


    /*
       Shoulder position
    */

    car.classList.remove(
        "shoulder-left"
    );

    car.classList.remove(
        "shoulder-right"
    );


    /*
       Signals
    */

    leftSignalLight.classList.remove(
        "active"
    );

    rightSignalLight.classList.remove(
        "active"
    );

}


/* =========================================================
   BUILD 1.2 LOADED
========================================================= */

console.log(
    "S.M.O.G. Driving Simulator — Build 1.2 loaded."
);

</script>
